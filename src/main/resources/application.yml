spring:
  application:
    name: ai-travel-guide

  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/ai_travel?useUnicode=true&characterEncoding=utf8&serverTimezone=Asia/Shanghai
    username: root
    password: mysql223

  ai:
    dashscope:
      api-key: sk-f035594d830d42e7a4d7299d195947c6
      chat:
        options:
          model: qwen-max
          temperature: 0.3
          max-tokens: 8192
      embedding:
        model: text-embedding-v3
        dimension: 1024
        options:
          encoding-format: float
          output-dimension: 1024

server:
  port: 8080
  # servlet.context-path 已移除，由 Controller 自行管理 /api 前缀

# MyBatis Plus
mybatis-plus:
  mapper-locations: classpath:/mapper/**/*.xml
  type-aliases-package: com.travel.entity
  global-config:
    db-config:
      id-type: assign_id
      # 逻辑删除由应用层自己控制，不依赖MP自动注入，避免WHERE条件异常
      # logic-delete-field: deleted
      # logic-delete-value: 1
      # logic-not-delete-value: 0
  configuration:
    map-underscore-to-camel-case: true
    # 改用 SLF4J 输出日志（可由日志框架控制级别，避免长参数刷屏）
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl

# 日志
logging:
  level:
    # MyBatis 设为 INFO，避免 DEBUG 级别打印超长 SQL 参数（如 mapData JSON）
    com.baomidou.mybatisplus: INFO
    root: INFO
    com.travel: DEBUG

# Sa-Token
sa-token:
  token-name: Authorization
  timeout: 2592000       # token有效期30天
  active-timeout: -1
  is-concurrent: true
  is-share: false

# Pinecone
pinecone:
  api-key: pcsk_6i9DoL_FqLTC38YixB1uSPJNiCYToP2wZqfuLePme5e4QYM46vQHWBJpaZmQgdvbCHpYzK
  index-name: travel-guide
  connection-timeout-sec: 5      # gRPC连接超时（秒）
  request-timeout-sec: 5         # 查询请求超时（秒）
  namespace:
    attractions: attractions     # 景点知识库
    cities: cities               # 城市知识库
    tips: travel-tips            # 旅行常识库
    hotels: hotels               # 酒店知识库
    food: food                   # 美食知识库
    user-prefix: user-           # 用户私有库前缀（user-{userId}）

# Serper 联网搜索
serper:
  api-key: be1c8bb7b3f6d09a0c76e0a1a3c193baaa139674
  base-url: https://google.serper.dev
  max-results: 5

# 高德地图
amap:
  web-key: 86273e71807139c717a2c650f15c792b        # Web服务Key（后端用）
  js-key: 051b40dc66f3b5e522738f026a027916            # JS API Key（前端用，返给前端）
  security-code: 54d316817ddf5ef76c99e390189f3b52

# 对话上下文
chat:
  context:
    max-rounds: 20      # 滑动窗口最大轮次
    ttl-seconds: 7200   # 上下文TTL 2小时

# 文件存储
file:
  storage-path: ./uploads
  pdf-path: ./exports/pdf

# 知识库（Markdown格式，启动时自动扫描向量化入库）
# 目录结构：
#   D:/Star/ai-travel-guide/知识库/
#     ├── 未向量化/    # 扫描源目录，放待处理的.md文件
#     └── 已向量化/    # 目标目录，向量化成功后会自动移动到这里
knowledge-base:
  md-path: D:/Star/ai-travel-guide/知识库   # Markdown知识库根目录
  auto-index-on-startup: true   # 启动时自动扫描（章节拆分后性能已优化）
  reindex-if-exists: false       # 不强制重新向量化

# RAG增强检索配置
rag:
  query-rewrite:
    enabled: true   # 是否启用查询重写
  multi-query:
    enabled: true   # 是否启用多查询扩展
    expansion-count: 3  # 扩展查询数量
  fusion:
    k: 60  # RRF算法常数

# 跨域
cors:
  allowed-origins: http://localhost:5173

# 百度翻译API（免费200万字符/月）
# 注册地址：https://api.fanyi.baidu.com/
baidu:
  translate:
    appid: 20260512002611709
    secret: sJt0f1TKSwLY7TcmMGd3
